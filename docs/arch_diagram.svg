<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="940" viewBox="0 0 1500 940" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>vpipe architecture diagram</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <style>
      .t  { font-size: 15px; font-weight: 600; fill: #0f172a; }
      .s  { font-size: 12px; fill: #334155; }
      .m  { font-size: 11px; fill: #475569; font-family: Consolas, Menlo, monospace; }
      .lb { font-size: 11px; fill: #1e293b; }
      .gt { font-size: 14px; font-weight: 700; fill: #475569; letter-spacing: .5px; }
      .thread { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.5; }
      .state  { fill: #ede9fe; stroke: #7c3aed; stroke-width: 1.5; }
      .queue  { fill: #fef3c7; stroke: #d97706; stroke-width: 1.5; }
      .worker { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
      .io     { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.5; }
      .group  { fill: none; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .flow   { fill: none; stroke: #334155; stroke-width: 1.6; marker-end: url(#arr); }
      .ctrl   { fill: none; stroke: #64748b; stroke-width: 1.4; stroke-dasharray: 5 4; marker-end: url(#arrd); }
    </style>
  </defs>

  <rect width="1500" height="940" fill="#ffffff"/>

  <text x="20" y="38" font-size="22" font-weight="700" fill="#0f172a">vpipe: real-time video inference pipeline (CPU)</text>
  <text x="20" y="58" class="s">Model A classifies every frame; frames that pass the routing rule go to Model B. Pools are separate processes (spawn) joined by bounded queues. Workers only run the model and echo frame_id; exceptions return as ERROR results.</text>

  <!-- ============ Main process ============ -->
  <rect x="20" y="75" width="910" height="735" rx="12" class="group"/>
  <text x="36" y="96" class="gt">MAIN PROCESS</text>

  <!-- Input -->
  <rect x="40" y="110" width="180" height="62" rx="8" class="io"/>
  <text x="130" y="135" text-anchor="middle" class="t">Input video</text>
  <text x="130" y="155" text-anchor="middle" class="m">file / SyntheticSource</text>

  <!-- Reader -->
  <rect x="260" y="105" width="260" height="115" rx="8" class="thread"/>
  <text x="390" y="128" text-anchor="middle" class="t">Reader thread</text>
  <text x="390" y="145" text-anchor="middle" class="m">reader.py</text>
  <text x="275" y="165" class="s">• assigns frame_id + t_ingest</text>
  <text x="275" y="182" class="s">• validates frame (INVALID)</text>
  <text x="275" y="199" class="s">• resizes for IPC (224 / 640 px)</text>
  <text x="275" y="214" class="s">• offline: blocks · live: DROPPED</text>

  <!-- Memory slots -->
  <rect x="600" y="105" width="300" height="68" rx="8" class="state"/>
  <text x="750" y="126" text-anchor="middle" class="t">Memory slots</text>
  <text x="750" y="143" text-anchor="middle" class="m">--max-buffered (default 64)</text>
  <text x="750" y="161" text-anchor="middle" class="s">reader takes one per frame, writer returns it</text>

  <!-- FrameStore -->
  <rect x="40" y="340" width="180" height="120" rx="8" class="state"/>
  <text x="130" y="365" text-anchor="middle" class="t">FrameStore</text>
  <text x="130" y="388" text-anchor="middle" class="s">full-resolution</text>
  <text x="130" y="404" text-anchor="middle" class="s">originals, kept for</text>
  <text x="130" y="420" text-anchor="middle" class="s">annotation</text>
  <text x="130" y="444" text-anchor="middle" class="m">bounded by slots</text>

  <!-- Aggregator -->
  <rect x="260" y="320" width="380" height="160" rx="8" class="thread" stroke-width="2.5"/>
  <text x="450" y="344" text-anchor="middle" class="t">Aggregator / Router (main thread)</text>
  <text x="450" y="361" text-anchor="middle" class="m">aggregator.py · single owner of per-frame state</text>
  <text x="278" y="384" class="s">• routing: top-1 in route_labels AND conf ≥ threshold</text>
  <text x="278" y="402" class="s">• matches results by frame_id + stage, not arrival</text>
  <text x="278" y="420" class="s">• late results discarded, never overwrite</text>
  <text x="278" y="438" class="s">• deadlines → TIMEOUT · dead worker → CRASHED</text>
  <text x="278" y="456" class="s">• detect_every stride → SKIPPED (stride)</text>
  <text x="278" y="472" class="s">• no locks, no process code (unit-tested)</text>

  <!-- pending-B -->
  <rect x="700" y="405" width="190" height="75" rx="8" class="state"/>
  <text x="795" y="428" text-anchor="middle" class="t">pending-B deque</text>
  <text x="795" y="447" text-anchor="middle" class="s">routed frames wait here;</text>
  <text x="795" y="463" text-anchor="middle" class="s">main loop never blocks on B</text>

  <!-- Reorder buffer -->
  <rect x="260" y="545" width="380" height="68" rx="8" class="state"/>
  <text x="450" y="570" text-anchor="middle" class="t">Reorder buffer</text>
  <text x="450" y="590" text-anchor="middle" class="s">releases frame k only after frames 0..k-1</text>
  <text x="450" y="605" text-anchor="middle" class="m">exactly one record per input frame</text>

  <!-- Writer -->
  <rect x="260" y="670" width="380" height="118" rx="8" class="thread"/>
  <text x="450" y="693" text-anchor="middle" class="t">Writer thread (ordered stage)</text>
  <text x="450" y="710" text-anchor="middle" class="m">writer.py · analytics.py · attributes.py</text>
  <text x="278" y="731" class="s">• annotates original; ffmpeg libx264 (CRF 23)</text>
  <text x="278" y="749" class="s">• asserts frame_id == last + 1; releases slot</text>
  <text x="278" y="767" class="s">• people preset: ByteTrack, scene cuts, line count,</text>
  <text x="290" y="782" class="s">person attributes (per-track averaging)</text>

  <!-- Sampler -->
  <rect x="700" y="670" width="190" height="118" rx="8" class="thread"/>
  <text x="795" y="693" text-anchor="middle" class="t">Sampler thread</text>
  <text x="795" y="710" text-anchor="middle" class="m">metrics.py</text>
  <text x="795" y="734" text-anchor="middle" class="s">every 100 ms:</text>
  <text x="795" y="751" text-anchor="middle" class="s">queue depths, buffered</text>
  <text x="795" y="768" text-anchor="middle" class="s">counts, CPU %, RSS</text>

  <!-- Outputs -->
  <rect x="260" y="835" width="380" height="80" rx="8" class="io"/>
  <text x="450" y="858" text-anchor="middle" class="t">Outputs (--output-dir)</text>
  <text x="450" y="878" text-anchor="middle" class="m">output_annotated.mp4 · frames_log.json/.csv</text>
  <text x="450" y="896" text-anchor="middle" class="m">summary.json · people_tracks.csv · gallery</text>

  <!-- ============ Queues ============ -->
  <rect x="960" y="160" width="170" height="70" rx="8" class="queue"/>
  <text x="1045" y="186" text-anchor="middle" class="t">Queue A</text>
  <text x="1045" y="204" text-anchor="middle" class="m">bounded mp.Queue</text>
  <text x="1045" y="220" text-anchor="middle" class="m">--queue-a</text>

  <rect x="960" y="310" width="170" height="70" rx="8" class="queue"/>
  <text x="1045" y="336" text-anchor="middle" class="t">Results queue</text>
  <text x="1045" y="354" text-anchor="middle" class="m">mp.Queue</text>
  <text x="1045" y="370" text-anchor="middle" class="m">A + B results</text>

  <rect x="960" y="560" width="170" height="70" rx="8" class="queue"/>
  <text x="1045" y="586" text-anchor="middle" class="t">Queue B</text>
  <text x="1045" y="604" text-anchor="middle" class="m">bounded mp.Queue</text>
  <text x="1045" y="620" text-anchor="middle" class="m">--queue-b</text>

  <!-- ============ Worker pools ============ -->
  <rect x="1170" y="90" width="310" height="200" rx="12" class="group"/>
  <text x="1186" y="112" class="gt">MODEL A POOL · N processes</text>
  <rect x="1190" y="125" width="270" height="68" rx="8" class="worker"/>
  <text x="1325" y="150" text-anchor="middle" class="t">A0: yolo11n-cls</text>
  <text x="1325" y="170" text-anchor="middle" class="m">people preset: PersonGate</text>
  <text x="1325" y="185" text-anchor="middle" class="m">(yolo11n, person only)</text>
  <rect x="1190" y="205" width="270" height="68" rx="8" class="worker"/>
  <text x="1325" y="232" text-anchor="middle" class="t">A1 … A(N-1)</text>
  <text x="1325" y="252" text-anchor="middle" class="m">--a-workers N</text>

  <rect x="1170" y="480" width="310" height="200" rx="12" class="group"/>
  <text x="1186" y="502" class="gt">MODEL B POOL · M processes</text>
  <rect x="1190" y="515" width="270" height="68" rx="8" class="worker"/>
  <text x="1325" y="540" text-anchor="middle" class="t">B0: yolo11n detect</text>
  <text x="1325" y="560" text-anchor="middle" class="m">people preset: yolo11s</text>
  <rect x="1190" y="595" width="270" height="68" rx="8" class="worker"/>
  <text x="1325" y="622" text-anchor="middle" class="t">B1 … B(M-1)</text>
  <text x="1325" y="642" text-anchor="middle" class="m">--b-workers M</text>

  <!-- Crash detection -->
  <rect x="1170" y="720" width="310" height="90" rx="8" class="io"/>
  <text x="1325" y="743" text-anchor="middle" class="t">Crash detection (pools.py)</text>
  <text x="1325" y="762" text-anchor="middle" class="s">each worker publishes its frame_id in</text>
  <text x="1325" y="778" text-anchor="middle" class="s">shared memory; dead process → frame</text>
  <text x="1325" y="794" text-anchor="middle" class="s">CRASHED, worker respawned (generation+1)</text>

  <!-- Worker note -->

  <!-- ============ Arrows ============ -->
  <!-- input -> reader -->
  <path d="M220,141 L258,141" class="flow"/>
  <!-- reader -> slots -->
  <path d="M520,135 L598,135" class="ctrl"/>
  <text x="530" y="128" class="lb">acquire</text>
  <!-- reader -> framestore -->
  <path d="M260,195 L130,195 L130,338" class="flow"/>
  <text x="138" y="260" class="lb">original</text>
  <text x="138" y="274" class="lb">(full-res)</text>
  <!-- reader -> queue A -->
  <path d="M520,195 L958,195" class="flow"/>
  <text x="700" y="213" class="lb">Task(frame_id, 224 px image)</text>
  <!-- queue A -> pool A -->
  <path d="M1130,195 L1168,195" class="flow"/>
  <!-- reader -> aggregator events -->
  <path d="M390,220 L390,318" class="ctrl"/>
  <text x="398" y="268" class="lb">IngestEvent / EOF</text>
  <!-- pool A -> results -->
  <path d="M1220,290 L1220,330 L1132,330" class="flow"/>
  <!-- pool B -> results -->
  <path d="M1300,480 L1300,365 L1132,365" class="flow"/>
  <text x="1308" y="420" class="lb">WorkerResult</text>
  <text x="1308" y="434" class="lb">(frame_id, boxes)</text>
  <text x="1228" y="312" class="lb">WorkerResult(frame_id, label, conf)</text>
  <!-- results -> aggregator -->
  <path d="M960,345 L642,345" class="flow"/>
  <text x="700" y="338" class="lb">results (any order)</text>
  <!-- aggregator -> pending B -->
  <path d="M640,442 L698,442" class="flow"/>
  <text x="646" y="436" class="lb">routed</text>
  <!-- pending B -> queue B -->
  <path d="M890,442 L925,442 L925,595 L958,595" class="flow"/>
  <text x="790" y="520" class="lb">Task(frame_id, 640 px)</text>
  <text x="790" y="534" class="lb">when Queue B has room</text>
  <!-- queue B -> pool B -->
  <path d="M1130,595 L1168,595" class="flow"/>
  <!-- crash -> pool B -->
  <path d="M1325,720 L1325,682" class="ctrl"/>
  <!-- aggregator -> reorder -->
  <path d="M450,480 L450,543" class="flow"/>
  <text x="458" y="505" class="lb">final state: SKIPPED · DETECTIONS · NO_DETECTIONS</text>
  <text x="458" y="519" class="lb">ERROR · TIMEOUT · CRASHED · DROPPED · ABORTED</text>
  <!-- reorder -> writer -->
  <path d="M450,613 L450,668" class="flow"/>
  <text x="458" y="645" class="lb">in frame_id order</text>
  <!-- framestore -> writer -->
  <path d="M130,460 L130,729 L258,729" class="flow"/>
  <text x="138" y="600" class="lb">original</text>
  <text x="138" y="614" class="lb">frame</text>
  <!-- writer -> outputs -->
  <path d="M450,788 L450,833" class="flow"/>

  <!-- ============ Legend ============ -->
  <rect x="680" y="835" width="800" height="80" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <path d="M700,858 L750,858" class="flow"/>
  <text x="758" y="862" class="s">data flow</text>
  <path d="M840,858 L890,858" class="ctrl"/>
  <text x="898" y="862" class="s">control / event</text>
  <rect x="1010" y="849" width="18" height="16" rx="3" class="thread"/><text x="1034" y="862" class="s">thread</text>
  <rect x="1095" y="849" width="18" height="16" rx="3" class="state"/><text x="1119" y="862" class="s">bounded state</text>
  <rect x="1215" y="849" width="18" height="16" rx="3" class="queue"/><text x="1239" y="862" class="s">IPC queue</text>
  <rect x="1320" y="849" width="18" height="16" rx="3" class="worker"/><text x="1344" y="862" class="s">worker process</text>
  <text x="700" y="890" class="s">offline: reader blocks on backpressure, never drops a frame · live: paced at source FPS, full Queue A → DROPPED</text>
  <text x="700" y="906" class="s">Every input frame yields exactly one output frame and one log record, whatever its status.</text>
</svg>
